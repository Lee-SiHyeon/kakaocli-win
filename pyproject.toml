[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kakaocli-win"
version = "0.2.0"
description = "A safety-first, unofficial KakaoTalk CLI for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pywin32>=306", "numpy>=1.26"]

[project.scripts]
kakaocli = "kakaocli_win.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
